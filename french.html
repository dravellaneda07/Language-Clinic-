<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulaire — Un brillant avenir, Chapitre 8</title>
<style>
  :root {
    --bleu: #1a3d6d;
    --bleu-clair: #eef3fa;
    --rouge: #b3282d;
    --or: #c9962c;
    --texte: #2a2a2a;
    --gris: #6b6b6b;
    --bordure: #d8dee8;
    --vert: #2e7d4f;
    --fond-vert: #e8f5ee;
    --fond-rouge: #fbeaea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f6f7fb;
    color: var(--texte);
    line-height: 1.5;
  }
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 12px;
    color: var(--rouge);
    font-weight: 700;
  }
  header h1 {
    margin: 6px 0 4px;
    font-size: 1.5rem;
    color: var(--bleu);
  }
  header p {
    margin: 0;
    color: var(--gris);
    font-size: 0.9rem;
  }
  .tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 22px;
  }
  .tab-btn {
    border: 2px solid var(--bleu);
    background: #fff;
    color: var(--bleu);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--bleu);
    color: #fff;
  }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ---- Flashcards ---- */
  .fc-progress {
    text-align: center;
    color: var(--gris);
    font-size: 0.85rem;
    margin-bottom: 10px;
  }
  .card-wrap {
    perspective: 1200px;
    margin-bottom: 18px;
  }
  .card {
    position: relative;
    min-height: 220px;
    border-radius: 14px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 14px;
    border: 1px solid var(--bordure);
    background: #fff;
    box-shadow: 0 2px 10px rgba(20,30,60,0.06);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    text-align: center;
  }
  .face.front .word {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--bleu);
  }
  .face.front .hint {
    margin-top: 10px;
    font-size: 0.8rem;
    color: var(--gris);
  }
  .face.back {
    transform: rotateY(180deg);
    background: var(--bleu-clair);
  }
  .face.back .meaning {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--bleu);
    margin-bottom: 10px;
  }
  .face.back .example {
    font-style: italic;
    color: var(--texte);
    font-size: 0.92rem;
    margin-bottom: 8px;
  }
  .face.back .translation {
    font-size: 0.85rem;
    color: var(--gris);
  }
  .fc-controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  button.ctrl {
    border: 1px solid var(--bordure);
    background: #fff;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 0.88rem;
    cursor: pointer;
    color: var(--texte);
  }
  button.ctrl.primary {
    background: var(--bleu);
    color: #fff;
    border-color: var(--bleu);
  }
  button.ctrl:hover { filter: brightness(0.97); }

  /* ---- Quiz ---- */
  .quiz-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: var(--gris);
    margin-bottom: 8px;
  }
  .bar-track {
    height: 8px;
    background: #e4e8f0;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .bar-fill {
    height: 100%;
    background: var(--or);
    width: 0%;
    transition: width 0.3s;
  }
  .quiz-card {
    background: #fff;
    border: 1px solid var(--bordure);
    border-radius: 14px;
    padding: 26px 22px;
    box-shadow: 0 2px 10px rgba(20,30,60,0.06);
  }
  .quiz-sentence {
    font-size: 1.05rem;
    margin-bottom: 20px;
  }
  .quiz-sentence .blank {
    display: inline-block;
    min-width: 90px;
    border-bottom: 2px solid var(--bleu);
    color: transparent;
  }
  .choices {
    display: grid;
    gap: 10px;
  }
  .choice-btn {
    text-align: left;
    padding: 12px 14px;
    border-radius: 9px;
    border: 1px solid var(--bordure);
    background: #fbfbfd;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .choice-btn:hover { background: #f0f3fa; }
  .choice-btn.correct {
    background: var(--fond-vert);
    border-color: var(--vert);
    color: var(--vert);
    font-weight: 600;
  }
  .choice-btn.incorrect {
    background: var(--fond-rouge);
    border-color: var(--rouge);
    color: var(--rouge);
    font-weight: 600;
  }
  .choice-btn:disabled { cursor: default; }
  .feedback {
    margin-top: 16px;
    font-size: 0.88rem;
    color: var(--gris);
    min-height: 20px;
  }
  .quiz-next {
    margin-top: 14px;
    text-align: right;
  }
  .quiz-summary {
    text-align: center;
    padding: 30px 10px;
  }
  .quiz-summary .score {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--bleu);
    margin-bottom: 6px;
  }
  .quiz-summary p { color: var(--gris); margin-bottom: 20px; }
  footer.note {
    margin-top: 26px;
    text-align: center;
    font-size: 0.78rem;
    color: var(--gris);
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="eyebrow">Étude du vocabulaire</div>
    <h1>Un brillant avenir — Chapitre 8</h1>
    <p>21 mots et expressions tirés du texte</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="fiches">Fiches</button>
    <button class="tab-btn" data-tab="quiz">Quiz</button>
  </div>

  <!-- FLASHCARDS -->
  <section id="panel-fiches" class="panel active">
    <div class="fc-progress" id="fcProgress">1 / 21</div>
    <div class="card-wrap">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Cliquer pour retourner la carte">
        <div class="face front">
          <div class="word" id="fcWord"></div>
          <div class="hint">Clique sur la carte pour voir le sens</div>
        </div>
        <div class="face back">
          <div class="meaning" id="fcMeaning"></div>
          <div class="example" id="fcExample"></div>
          <div class="translation" id="fcTranslation"></div>
        </div>
      </div>
    </div>
    <div class="fc-controls">
      <button class="ctrl" id="fcPrev">← Précédent</button>
      <button class="ctrl primary" id="fcFlip">Retourner</button>
      <button class="ctrl" id="fcNext">Suivant →</button>
      <button class="ctrl" id="fcShuffle">🔀 Mélanger</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="panel-quiz" class="panel">
    <div id="quizArea">
      <div class="quiz-top">
        <span id="quizPos">Question 1 / 21</span>
        <span id="quizScore">Score : 0</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="quizBar"></div></div>
      <div class="quiz-card">
        <div class="quiz-sentence" id="quizSentence"></div>
        <div class="choices" id="quizChoices"></div>
        <div class="feedback" id="quizFeedback"></div>
        <div class="quiz-next">
          <button class="ctrl primary" id="quizNextBtn" style="display:none;">Question suivante →</button>
        </div>
      </div>
    </div>
    <div id="quizSummary" class="quiz-summary" style="display:none;">
      <div class="score" id="finalScore"></div>
      <p id="finalMsg"></p>
      <button class="ctrl primary" id="quizRestart">Recommencer le quiz</button>
    </div>
  </section>

  <footer class="note">Textes et exemples adaptés de « Un brillant avenir », chapitre 8.</footer>
</div>

<script>
  // ---- Données de vocabulaire ----
  const VOCAB = [
    { word: "convoité(e)", meaning: "très désiré, envié", example: "Les passeports les plus ___ du monde.", translation: "coveted / highly sought-after" },
    { word: "décrocher le gros lot", meaning: "avoir énormément de chance (expression idiomatique)", example: "Le Roumain devenu américain avait ___.", translation: "to hit the jackpot" },
    { word: "le décalage horaire", meaning: "la différence d'heure entre deux fuseaux horaires", example: "___ rend le sommeil profond.", translation: "jet lag / time difference" },
    { word: "noter", meaning: "écrire, prendre en note", example: "Il a ___ sur une feuille toutes les indications.", translation: "to note down" },
    { word: "parvenir (à)", meaning: "arriver à, atteindre un lieu", example: "Ils ___ à la résidence moderne.", translation: "to reach / to arrive at" },
    { word: "bien coupé(e)", meaning: "bien taillé, bien ajusté (vêtement)", example: "Une belle chemise blanche ___.", translation: "well-cut / well-tailored" },
    { word: "au teint mat", meaning: "à la peau légèrement foncée ou hâlée", example: "Une jolie femme ___.", translation: "with an olive/tan complexion" },
    { word: "desserrer (les lèvres)", meaning: "(figuré, souvent négatif) parler, ouvrir la bouche", example: "Helen ne ___ pas les lèvres.", translation: "to open one's mouth / say a word" },
    { word: "rendre fou / folle", meaning: "faire perdre patience, exaspérer", example: "La voix de Doru... ___ Helen.", translation: "to drive someone crazy" },
    { word: "gâcher", meaning: "abîmer, ruiner quelque chose de positif", example: "___ l'extrême beauté du paysage.", translation: "to spoil / to ruin" },
    { word: "avoir à peine le temps de", meaning: "avoir très peu de temps pour faire quelque chose", example: "Ils ___ le temps de s'installer.", translation: "to barely have time to" },
    { word: "enfiler", meaning: "mettre un vêtement, souvent rapidement", example: "Avant de s'___ d'élégantes tenues.", translation: "to slip on / put on (clothes)" },
    { word: "serti de", meaning: "(bijou) orné, incrusté de pierres précieuses", example: "Un gros diamant ___ saphirs.", translation: "set with (jewels)" },
    { word: "hormis", meaning: "sauf, à part, à l'exception de", example: "___ la petite broche héritée de sa grand-mère.", translation: "except for / apart from" },
    { word: "se faire voler", meaning: "se faire dérober quelque chose, être victime d'un vol", example: "Elle n'a pas peur de les perdre ou de ___.", translation: "to get robbed" },
    { word: "le cadet / la cadette", meaning: "le plus jeune (frère, sœur, fils)", example: "L'amie du ___.", translation: "the youngest sibling" },
    { word: "assaillir (de questions)", meaning: "submerger, bombarder de questions", example: "La mère de Marie ___ de questions Jacob et Helen.", translation: "to bombard with questions" },
    { word: "poisseux / poisseuse", meaning: "collant(e), sale au toucher", example: "Les casseroles ___.", translation: "sticky / grimy" },
    { word: "il fait encore nuit", meaning: "expression météo : il fait encore sombre dehors", example: "___, et il fait très froid.", translation: "it's still dark out" },
    { word: "guetter", meaning: "surveiller, attendre en observant attentivement", example: "Elle ___ les voitures qui passent.", translation: "to watch out for / be on the lookout" },
    { word: "se taire", meaning: "rester silencieux, ne rien dire", example: "Faut-il ___ ?", translation: "to keep quiet / be silent" }
  ];

  // ================= FLASHCARDS =================
  let fcOrder = VOCAB.map((_, i) => i);
  let fcIndex = 0;

  const cardEl = document.getElementById('card');
  const fcWord = document.getElementById('fcWord');
  const fcMeaning = document.getElementById('fcMeaning');
  const fcExample = document.getElementById('fcExample');
  const fcTranslation = document.getElementById('fcTranslation');
  const fcProgress = document.getElementById('fcProgress');

  function renderCard() {
    const item = VOCAB[fcOrder[fcIndex]];
    cardEl.classList.remove('flipped');
    fcWord.textContent = item.word;
    fcMeaning.textContent = item.meaning;
    fcExample.textContent = "« " + item.example.replace('___', '…') + " »";
    fcTranslation.textContent = item.translation;
    fcProgress.textContent = (fcIndex + 1) + " / " + VOCAB.length;
  }

  cardEl.addEventListener('click', () => cardEl.classList.toggle('flipped'));
  cardEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cardEl.classList.toggle('flipped'); }
  });
  document.getElementById('fcFlip').addEventListener('click', () => cardEl.classList.toggle('flipped'));
  document.getElementById('fcNext').addEventListener('click', () => {
    fcIndex = (fcIndex + 1) % VOCAB.length;
    renderCard();
  });
  document.getElementById('fcPrev').addEventListener('click', () => {
    fcIndex = (fcIndex - 1 + VOCAB.length) % VOCAB.length;
    renderCard();
  });
  document.getElementById('fcShuffle').addEventListener('click', () => {
    for (let i = fcOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [fcOrder[i], fcOrder[j]] = [fcOrder[j], fcOrder[i]];
    }
    fcIndex = 0;
    renderCard();
  });

  renderCard();

  // ================= QUIZ =================
  let quizOrder = [];
  let quizIndex = 0;
  let quizScore = 0;
  let answered = false;

  function shuffledIndices(n) {
    const arr = Array.from({ length: n }, (_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startQuiz() {
    quizOrder = shuffledIndices(VOCAB.length);
    quizIndex = 0;
    quizScore = 0;
    document.getElementById('quizArea').style.display = 'block';
    document.getElementById('quizSummary').style.display = 'none';
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    const item = VOCAB[quizOrder[quizIndex]];
    document.getElementById('quizPos').textContent = "Question " + (quizIndex + 1) + " / " + VOCAB.length;
    document.getElementById('quizScore').textContent = "Score : " + quizScore;
    document.getElementById('quizBar').style.width = (quizIndex / VOCAB.length * 100) + "%";
    document.getElementById('quizSentence').textContent = item.example.replace('___', '＿＿＿＿＿');

    // Build 4 choices: correct + 3 distractors
    const others = VOCAB.filter((v) => v.word !== item.word).map((v) => v.word);
    for (let i = others.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [others[i], others[j]] = [others[j], others[i]];
    }
    const choices = [item.word, ...others.slice(0, 3)];
    for (let i = choices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [choices[i], choices[j]] = [choices[j], choices[i]];
    }

    const choicesEl = document.getElementById('quizChoices');
    choicesEl.innerHTML = '';
    document.getElementById('quizFeedback').textContent = '';
    document.getElementById('quizNextBtn').style.display = 'none';

    choices.forEach((choice) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choice;
      btn.addEventListener('click', () => selectAnswer(btn, choice, item));
      choicesEl.appendChild(btn);
    });
  }

  function selectAnswer(btn, choice, item) {
    if (answered) return;
    answered = true;
    const allBtns = document.querySelectorAll('.choice-btn');
    allBtns.forEach((b) => {
      b.disabled = true;
      if (b.textContent === item.word) b.classList.add('correct');
    });
    if (choice === item.word) {
      quizScore++;
      document.getElementById('quizFeedback').textContent = "✔ Correct ! " + item.meaning + " — " + item.translation;
    } else {
      btn.classList.add('incorrect');
      document.getElementById('quizFeedback').textContent = "✘ La bonne réponse était « " + item.word + " » : " + item.meaning + " (" + item.translation + ")";
    }
    document.getElementById('quizScore').textContent = "Score : " + quizScore;
    document.getElementById('quizNextBtn').style.display = 'inline-block';
  }

  document.getElementById('quizNextBtn').addEventListener('click', () => {
    quizIndex++;
    if (quizIndex >= VOCAB.length) {
      finishQuiz();
    } else {
      renderQuestion();
    }
  });

  function finishQuiz() {
    document.getElementById('quizBar').style.width = '100%';
    document.getElementById('quizArea').style.display = 'none';
    document.getElementById('quizSummary').style.display = 'block';
    const pct = Math.round((quizScore / VOCAB.length) * 100);
    document.getElementById('finalScore').textContent = quizScore + " / " + VOCAB.length + " (" + pct + "%)";
    let msg = "Continue à réviser ces expressions idiomatiques dans leur contexte.";
    if (pct === 100) msg = "Excellent ! Tu maîtrises tout le vocabulaire de ce chapitre.";
    else if (pct >= 80) msg = "Très bon score ! Revois les quelques mots manqués.";
    else if (pct >= 50) msg = "Bon début — reprends les fiches avant de refaire le quiz.";
    document.getElementById('finalMsg').textContent = msg;
  }

  document.getElementById('quizRestart').addEventListener('click', startQuiz);

  // ================= TABS =================
  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'quiz' && quizOrder.length === 0) startQuiz();
    });
  });
</script>
</body>
</html>
